<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JS Zakirhub - Cyber Terminal</title>
<link rel="stylesheet" href="cyber.css">
</head>
<body>

<div id="authScreen">
  <h2>[ CYBER SCOUT TERMINAL ]</h2>
  <p style="color:#888;">Authorized Personnel Only</p>
  <button class="cyber-btn" onclick="doGoogleLogin()">LOGIN WITH GOOGLE</button>
  <div class="msg" id="authMsg" style="color: #f48771; margin-top: 15px;"></div>
</div>

<div id="app">
  <div class="header">
    <h1>_CYBER_SCOUT_</h1>
    <a href="index.html">⬅ হোম পেজ</a>
  </div>
  
  <div class="terminal-window" id="chatMessages">
  </div>

  <div class="input-area">
    <span>root@scout:~#</span>
    <input type="text" id="chatInput" placeholder="Type command/message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">SEND</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="cyber.js"></script>
</body>
</html>
