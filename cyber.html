<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JS Zakirhub - Cyber Terminal</title>
<link rel="stylesheet" href="cyber.css">
<style>
  .lang-select { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 6px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; outline: none; margin-right: 10px; }
  .lang-select option { background: #000; color: #00ff00; }
</style>
</head>
<body>

<div id="authScreen">
  <h2>[ CYBER SCOUT TERMINAL ]</h2>
  <p style="color:#888;" data-i18n="authText">Authorized Personnel Only</p>
  <button class="cyber-btn" onclick="doGoogleLogin()" data-i18n="loginBtn">LOGIN WITH GOOGLE</button>
  <div class="msg" id="authMsg" style="color: #f48771; margin-top: 15px;"></div>
</div>

<div id="app">
  <div class="header">
    <h1>_CYBER_SCOUT_</h1>
    <div>
      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="en">🌐 EN</option>
        <option value="bn">🌐 BN</option>
        <option value="hi">🌐 HI</option>
        <option value="ar">🌐 AR</option>
        <option value="ur">🌐 UR</option>
        <option value="es">🌐 ES</option>
      </select>
      <a href="index.html" data-i18n="homeBtn">⬅ Home Page</a>
    </div>
  </div>
  
  <div class="terminal-window" id="chatMessages"></div>

  <div class="input-area">
    <span>root@scout:~#</span>
    <input type="text" id="chatInput" placeholder="Type command..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()" data-i18n="sendBtn">SEND</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="cyber.js"></script>
</body>
</html>
